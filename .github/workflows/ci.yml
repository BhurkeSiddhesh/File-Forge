name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
        disable-ai: ['0']
        include:
          # No-AI profile: verifies the app works with OCR disabled entirely
          - python-version: '3.12'
            disable-ai: '1'
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v --tb=short --junit-xml=junit.xml -o junit_family=xunit1
        env:
          PYTHONPATH: .
          DISABLE_AI: ${{ matrix.disable-ai }}

      - name: Upload Test Results to Trunk
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: trunk-io/analytics-uploader@v2
        with:
          junit-paths: "**/junit.xml"
          org-slug: siddhesh-bhurke
          token: ${{ secrets.TRUNK_API_TOKEN }}
        env:
          TRUNK_API_TOKEN: ${{ secrets.TRUNK_API_TOKEN }}

      - name: Test summary
        if: always()
        run: |
          echo "Tests completed for Python ${{ matrix.python-version }}"

